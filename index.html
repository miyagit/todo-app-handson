<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="今日やることを整理する、シンプルなTODOアプリの画面サンプルです。"
    >
    <title>今日のタスク | TODOアプリ</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="app-eyebrow">MY DAILY PLANNER</p>
        <h1 class="app-title">今日のタスク</h1>
        <p class="app-description">ひとつずつ、できることから。</p>
      </header>

      <section class="task-panel" aria-labelledby="task-list-title">
        <form class="task-form">
          <label class="visually-hidden" for="new-task">新しいタスク</label>
          <input
            class="task-input"
            id="new-task"
            name="task"
            type="text"
            placeholder="次にやることは？"
          >
          <button class="add-button" type="button">＋ <span>追加する</span></button>
        </form>

        <div class="task-list-header">
          <h2 class="task-list-title" id="task-list-title">タスク一覧</h2>
          <p class="task-count"><strong>3</strong> 件</p>
        </div>

        <ul class="task-list">
          <li class="task-item">
            <label class="task-label">
              <input class="task-checkbox" type="checkbox">
              <span class="task-text">朝のストレッチをする</span>
            </label>
            <div class="task-actions">
              <button class="task-action" type="button" aria-label="朝のストレッチをするを編集">編集</button>
              <button class="task-action task-action-delete" type="button" aria-label="朝のストレッチをするを削除">削除</button>
            </div>
          </li>
          <li class="task-item">
            <label class="task-label">
              <input class="task-checkbox" type="checkbox">
              <span class="task-text">メールを確認する</span>
            </label>
            <div class="task-actions">
              <button class="task-action" type="button" aria-label="メールを確認するを編集">編集</button>
              <button class="task-action task-action-delete" type="button" aria-label="メールを確認するを削除">削除</button>
            </div>
          </li>
          <li class="task-item is-completed">
            <label class="task-label">
              <input class="task-checkbox" type="checkbox" checked>
              <span class="task-text">コーヒーを淹れる</span>
            </label>
            <div class="task-actions">
              <button class="task-action" type="button" aria-label="コーヒーを淹れるを編集">編集</button>
              <button class="task-action task-action-delete" type="button" aria-label="コーヒーを淹れるを削除">削除</button>
            </div>
          </li>
        </ul>

        <footer class="task-panel-footer">
          <span class="completion-mark" aria-hidden="true">✓</span>
          <p>小さな一歩も、大切な前進です。</p>
        </footer>
      </section>

      <p class="app-note">今日も自分のペースで進めましょう</p>
    </main>
  </body>
</html>
